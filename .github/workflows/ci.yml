name: Platform CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_DIR: ./src/mafia-api
      WEB_DIR: ./src/mafia-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read verified source revisions
        id: revisions
        run: |
          for key in api web; do
            sha=$(jq -er --arg key "$key" '.[$key] | select(test("^[a-f0-9]{40}$"))' sources.json)
            printf '%s=%s\n' "$key" "$sha" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InnoMafia/mafia-api
          ref: ${{ steps.revisions.outputs.api }}
          path: src/mafia-api
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InnoMafia/mafia-web
          ref: ${{ steps.revisions.outputs.web }}
          path: src/mafia-web
          persist-credentials: false
      - name: Verify the web contract
        run: cmp "$API_DIR/api/openapi.yaml" "$WEB_DIR/contracts/openapi.yaml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make dev
      - run: make e2e
      - name: Check readiness during a PostgreSQL outage
        run: |
          docker compose stop db
          status() { curl --noproxy '*' --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8787/$1"; }
          test "$(status healthz)" = 204
          test "$(status readyz)" = 503
          test "$(status api/v1/status)" = 503
          docker compose start db
          make smoke
      - name: Print container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Save browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop CI stack
        if: always()
        run: docker compose down --volumes
